<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 810" width="100%" id="diagram-root" style="max-width:800px; height:auto; background:#ffffff; border-radius:10px; font-family:'Sarabun', 'TH Sarabun New', 'Prompt', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadowFilter" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <polygon points="0 1.5, 7 4.5, 0 7.5" fill="#0284c7" />
    </marker>
  </defs>
  <!-- Banner -->
  <g id="banner" filter="url(#shadowFilter)">
    <rect x="40" y="32" width="780" height="58" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="430" y="68" fill="#0369a1" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">การไหลของข้อมูลใน Converged Gateway</text>
  </g>
  <!-- Card Group: 1. Field Hardware Layer -->
  <g id="card-group-1">
    <!-- Badge -->
    <rect x="40" y="112" width="265.5" height="28" rx="6" fill="#0284c7"/>
    <text x="54" y="131" fill="#ffffff" font-size="13" font-weight="700">1. Field Hardware Layer</text>
    <text x="317.5" y="131" fill="#64748b" font-size="13" font-weight="500">บอร์ดไมโครคอนโทรลเลอร์หน้างาน</text>
    <!-- Card Container -->
    <rect x="40" y="148" width="780" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <text x="62" y="174" font-size="14">
      <tspan fill="#0369a1" font-weight="600">ESP32 Node:</tspan>
      <tspan fill="#334155"> วัดค่าเซนเซอร์อนาล็อก (GPIO 34) ส่ง JSON สตรีมมิ่งผ่าน USB-UART</tspan>
    </text>
    <text x="62" y="204" font-size="14">
      <tspan fill="#0369a1" font-weight="600">Serial Transport:</tspan>
      <tspan fill="#334155"> สตรีมมิ่งข้อมูลต่อเนื่อง Baud Rate 115200 bps สู่เกตเวย์</tspan>
    </text>
  </g>
  <!-- Flow Connector -->
  <g id="connector-2">
    <line x1="430" y1="244" x2="430" y2="274" stroke="#0284c7" stroke-width="2.3" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
  </g>
  <!-- Card Group: 2. Ingestion &amp; Buffer Layer -->
  <g id="card-group-3">
    <!-- Badge -->
    <rect x="40" y="294" width="307.5" height="28" rx="6" fill="#0284c7"/>
    <text x="54" y="313" fill="#ffffff" font-size="13" font-weight="700">2. Ingestion &amp; Buffer Layer</text>
    <text x="359.5" y="313" fill="#64748b" font-size="13" font-weight="500">การรับและบัฟเฟอร์ข้อมูลในเกตเวย์</text>
    <!-- Card Container -->
    <rect x="40" y="330" width="780" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <text x="62" y="356" font-size="14">
      <tspan fill="#0369a1" font-weight="600">SerialPort Worker:</tspan>
      <tspan fill="#334155"> BackgroundService ดักอ่านข้อมูล Serial แบบ Non-blocking</tspan>
    </text>
    <text x="62" y="386" font-size="14">
      <tspan fill="#0369a1" font-weight="600">Unified State Store:</tspan>
      <tspan fill="#334155"> ส่งผ่านข้อมูลด้วย Channel&lt;T&gt; และ ConcurrentDictionary</tspan>
    </text>
  </g>
  <!-- Flow Connector -->
  <g id="connector-4">
    <line x1="430" y1="426" x2="430" y2="456" stroke="#0284c7" stroke-width="2.3" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
  </g>
  <!-- Card Group: 3. Protocol Distribution Layer -->
  <g id="card-group-5">
    <!-- Badge -->
    <rect x="40" y="476" width="339" height="28" rx="6" fill="#0284c7"/>
    <text x="54" y="495" fill="#ffffff" font-size="13" font-weight="700">3. Protocol Distribution Layer</text>
    <text x="391" y="495" fill="#64748b" font-size="13" font-weight="500">ตัวแปลงและกระจายโปรโตคอล</text>
    <!-- Card Container -->
    <rect x="40" y="512" width="780" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <text x="62" y="538" font-size="14">
      <tspan fill="#0369a1" font-weight="600">Embedded MQTT Broker:</tspan>
      <tspan fill="#334155"> เผยแพร่ลงหัวข้อ iot/esp32/telemetry (พอร์ต 1883)</tspan>
    </text>
    <text x="62" y="568" font-size="14">
      <tspan fill="#0369a1" font-weight="600">SignalR Realtime Hub:</tspan>
      <tspan fill="#334155"> ผลักข้อมูลสตรีมมิ่งขึ้น WebSockets (พอร์ต 5000)</tspan>
    </text>
  </g>
  <!-- Flow Connector -->
  <g id="connector-6">
    <line x1="430" y1="608" x2="430" y2="638" stroke="#0284c7" stroke-width="2.3" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
  </g>
  <!-- Card Group: 4. Presentation &amp; Client Layer -->
  <g id="card-group-7">
    <!-- Badge -->
    <rect x="40" y="658" width="339" height="28" rx="6" fill="#0284c7"/>
    <text x="54" y="677" fill="#ffffff" font-size="13" font-weight="700">4. Presentation &amp; Client Layer</text>
    <text x="391" y="677" fill="#64748b" font-size="13" font-weight="500">หน้าจอแสดงผลและควบคุม</text>
    <!-- Card Container -->
    <rect x="40" y="694" width="780" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <text x="62" y="720" font-size="14">
      <tspan fill="#0369a1" font-weight="600">Flutter Mobile App:</tspan>
      <tspan fill="#334155"> รับข้อมูลผ่าน MQTT Subscriber เพื่อขยับเข็มเกจวัดสด</tspan>
    </text>
    <text x="62" y="750" font-size="14">
      <tspan fill="#0369a1" font-weight="600">Web Browser Dashboard:</tspan>
      <tspan fill="#334155"> สตรีมมิ่งผ่าน SignalR แสดงผลกราฟิกและสวิตช์สั่งการ</tspan>
    </text>
  </g>
</svg>