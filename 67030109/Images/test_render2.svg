<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" id="diagram-root" style="max-width:800px; height:auto; background:#ffffff; border-radius:10px; font-family:'Sarabun', 'TH Sarabun New', 'Prompt', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadowFilter" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <polygon points="0 1.5, 7 4.5, 0 7.5" fill="#0284c7" />
    </marker>
  </defs>
  <!-- Connector 1 -> 2 -->
  <g id="connector-1">
    <!-- Arrow Line -->
    <line x1="375" y1="104" x2="497" y2="104" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  <!-- Box 1: Embedded MQTTnet Broker -->
  <g id="box-1" filter="url(#shadowFilter)">
    <!-- Base Card -->
    <rect x="36" y="32" width="339" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Header Container -->
    <rect x="36" y="32" width="339" height="56" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="205.5" y="58" fill="#0369a1" font-size="15" font-weight="700" text-anchor="middle">Embedded MQTTnet Broker</text>
  </g>
  <!-- Box 1 Items -->
  <g id="box-1-items">
    <text x="56" y="114" font-size="13">
      <tspan fill="#0369a1" font-weight="700">• </tspan>
      <tspan fill="#334155" font-weight="500">Topic: iot/esp32/telemetry</tspan>
    </text>
    <text x="56" y="140" font-size="13">
      <tspan fill="#0369a1" font-weight="700">• </tspan>
      <tspan fill="#334155" font-weight="500">└─────────────┬─────────────┘</tspan>
    </text>
    <text x="56" y="166" font-size="13">
      <tspan fill="#0369a1" font-weight="700">• </tspan>
      <tspan fill="#334155" font-weight="500">│</tspan>
    </text>
    <text x="56" y="192" font-size="13">
      <tspan fill="#0369a1" font-weight="700">• </tspan>
      <tspan fill="#334155" font-weight="500">▼</tspan>
    </text>
    <text x="56" y="218" font-size="13">
      <tspan fill="#0369a1" font-weight="700">• </tspan>
      <tspan fill="#334155" font-weight="500">[ Flutter Mobile App ]</tspan>
    </text>
  </g>
  <!-- Box 2: ASP.NET Core SignalR Hub -->
  <g id="box-2" filter="url(#shadowFilter)">
    <!-- Base Card -->
    <rect x="505" y="32" width="339" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Header Container -->
    <rect x="505" y="32" width="339" height="56" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="674.5" y="58" fill="#0369a1" font-size="15" font-weight="700" text-anchor="middle">ASP.NET Core SignalR Hub</text>
  </g>
  <!-- Box 2 Items -->
  <g id="box-2-items">
    <text x="525" y="114" font-size="13">
      <tspan fill="#0369a1" font-weight="700">• </tspan>
      <tspan fill="#334155" font-weight="500">Method: ReceiveTelemetry</tspan>
    </text>
    <text x="525" y="140" font-size="13">
      <tspan fill="#0369a1" font-weight="700">• </tspan>
      <tspan fill="#334155" font-weight="500">└─────────────┬─────────────┘</tspan>
    </text>
    <text x="525" y="166" font-size="13">
      <tspan fill="#0369a1" font-weight="700">• </tspan>
      <tspan fill="#334155" font-weight="500">▼</tspan>
    </text>
    <text x="525" y="192" font-size="13">
      <tspan fill="#0369a1" font-weight="700">• </tspan>
      <tspan fill="#334155" font-weight="500">[ Web Browser Dashboard ]</tspan>
    </text>
  </g>
</svg>