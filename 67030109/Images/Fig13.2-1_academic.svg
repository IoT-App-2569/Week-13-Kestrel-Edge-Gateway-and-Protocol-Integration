<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 598" width="100%" id="diagram-root" style="max-width:800px; height:auto; background:#ffffff; border-radius:10px; font-family:'Sarabun', 'TH Sarabun New', 'Prompt', system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="shadowFilter" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <polygon points="0 1.5, 7 4.5, 0 7.5" fill="#0284c7" />
    </marker>
  </defs>
  <!-- Banner -->
  <g id="banner" filter="url(#shadowFilter)">
    <rect x="40" y="32" width="780" height="58" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="430" y="68" fill="#0369a1" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0.5">โครงสร้างสถาปัตยกรรมภายในของ Kestrel</text>
  </g>
  <!-- Card Group: เลเยอร์ 1: Transport Layer -->
  <g id="card-group-1">
    <!-- Badge -->
    <rect x="40" y="112" width="297" height="28" rx="6" fill="#0284c7"/>
    <text x="54" y="131" fill="#ffffff" font-size="13" font-weight="700">เลเยอร์ 1: Transport Layer</text>
    <text x="349" y="131" fill="#64748b" font-size="13" font-weight="500">Socket Abstraction</text>
    <!-- Card Container -->
    <rect x="40" y="148" width="780" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <text x="62" y="174" font-size="14">
      <tspan fill="#0369a1" font-weight="600">Socket Transport:</tspan>
      <tspan fill="#334155"> จัดการ TCP/IP Sockets ผ่าน Linux epoll หรือ Windows IOCP</tspan>
    </text>
    <text x="62" y="204" font-size="14">
      <tspan fill="#0369a1" font-weight="600">Memory Pools:</tspan>
      <tspan fill="#334155"> ใช้ System.IO.Pipelines และ ArrayPool&lt;byte&gt; จัดการไบต์</tspan>
    </text>
  </g>
  <!-- Flow Connector -->
  <g id="connector-2">
    <line x1="430" y1="244" x2="430" y2="274" stroke="#0284c7" stroke-width="2.3" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
  </g>
  <!-- Card Group: เลเยอร์ 2: Protocol Framing &amp; Parsing -->
  <g id="card-group-3">
    <!-- Badge -->
    <rect x="40" y="294" width="412.5" height="28" rx="6" fill="#0284c7"/>
    <text x="54" y="313" fill="#ffffff" font-size="13" font-weight="700">เลเยอร์ 2: Protocol Framing &amp; Parsing</text>
    <text x="464.5" y="313" fill="#64748b" font-size="13" font-weight="500">Protocol Engine</text>
    <!-- Card Container -->
    <rect x="40" y="330" width="780" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <text x="62" y="356" font-size="14">
      <tspan fill="#0369a1" font-weight="600">HTTP Engine:</tspan>
      <tspan fill="#334155"> รองรับ HTTP/1.1, HTTP/2, และ HTTP/3 (QUIC)</tspan>
    </text>
    <text x="62" y="386" font-size="14">
      <tspan fill="#0369a1" font-weight="600">WebSocket Upgrader:</tspan>
      <tspan fill="#334155"> สลับโหมดการเชื่อมต่อจาก HTTP สู่ Full-Duplex Socket</tspan>
    </text>
  </g>
  <!-- Flow Connector -->
  <g id="connector-4">
    <line x1="430" y1="426" x2="430" y2="456" stroke="#0284c7" stroke-width="2.3" stroke-dasharray="4 3" marker-end="url(#arrowhead)"/>
  </g>
  <!-- Card Group: เลเยอร์ 3: Application Middleware Pipeline -->
  <g id="card-group-5">
    <!-- Badge -->
    <rect x="40" y="476" width="465" height="28" rx="6" fill="#0284c7"/>
    <text x="54" y="495" fill="#ffffff" font-size="13" font-weight="700">เลเยอร์ 3: Application Middleware Pipeline</text>
    <text x="517" y="495" fill="#64748b" font-size="13" font-weight="500">Application Layer</text>
    <!-- Card Container -->
    <rect x="40" y="512" width="780" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <text x="62" y="538" font-size="14">
      <tspan fill="#0369a1" font-weight="600">Middleware Pipeline:</tspan>
      <tspan fill="#334155"> Routing ──► Auth ──► CORS ──► Minimal APIs ──► SignalR</tspan>
    </text>
  </g>
</svg>